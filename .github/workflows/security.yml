name: Security

# Supply-chain security checks. All tools here are free and open-source and
# require NO secrets, so they run safely on pull requests from forks (no
# secret-dependent step gates an ordinary PR).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly-disclosed advisories against already-pinned deps get
    # caught even without a code change.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    name: Python dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Audit the exact pinned production closure that ships in the image.
      - name: Audit pinned production dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: constraints.txt

  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project + CycloneDX generator
        run: |
          python -m pip install . -c constraints.txt
          python -m pip install cyclonedx-bom==5.3.0
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --outfile sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  trivy:
    name: Filesystem & Dockerfile vulnerability/misconfig scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem + config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog (verified secrets only)
        uses: trufflesecurity/trufflehog@v3.82.6
        with:
          extra_args: --only-verified

  dependency-review:
    name: Dependency review (PRs)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install GhostMark (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest -v

      - name: ghostmark demo (smoke test)
        run: ghostmark demo

      - name: ghostmark --help / --version
        run: |
          ghostmark --help
          ghostmark --version

  independent-verification:
    name: "Independent Verification (ExifTool + c2patool)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ExifTool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl
          exiftool -ver

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-c2patool-${{ runner.os }}

      - name: Install c2patool
        run: |
          cargo install c2patool
          c2patool --version

      - name: Install GhostMark (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Confirm GhostMark detects ExifTool and c2patool
        run: |
          python -c "
          from ghostmark.independent_verify import C2paToolVerifier, ExifToolVerifier
          e = ExifToolVerifier()
          assert e.available(), 'ExifTool was installed but GhostMark could not find it on PATH'
          print(f'ExifTool {e.version()} detected by GhostMark')
          c = C2paToolVerifier()
          assert c.available(), 'c2patool was installed but GhostMark could not find it on PATH'
          print(f'c2patool {c.version()} detected by GhostMark')
          "

      - name: Run integration suite (real binaries, not mocked)
        run: python -m pytest tests/integration -v -rA --no-header

      - name: Confirm the suite actually ran (not silently skipped)
        run: |
          COUNT=$(python -m pytest tests/integration --collect-only -q | grep -c '::test_')
          echo "Collected $COUNT integration tests"
          test "$COUNT" -gt 0

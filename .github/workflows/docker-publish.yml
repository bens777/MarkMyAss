name: Publish Docker image

# Builds the production image (Dockerfile) and pushes it to GHCR on every
# push to main. Deployment stays a manual, human step on the VPS
# (docker compose pull && up -d) -- this workflow never deploys anything.
#
# No runtime configuration is baked in: GHOSTMARK_PUBLIC_URL and friends
# are injected at container start by docker-compose.prod.yml, never at
# image-build time. No secrets beyond the ephemeral GITHUB_TOKEN.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bens777/markmyass
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=
          labels: |
            org.opencontainers.image.title=MarkMyAss
            org.opencontainers.image.description=AI watermark, metadata and provenance cleaner (GhostMark engine)
            org.opencontainers.image.source=https://github.com/bens777/MarkMyAss

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghostmark"
version = "0.5.0"
description = "Open-source AI watermark & provenance cleaner. Inspect, sanitize and verify metadata and supported watermark signals in AI-generated text, images and documents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "GhostMark contributors" }]
keywords = [
  "ai",
  "watermark",
  "watermark-remover",
  "ai-watermark",
  "provenance",
  "c2pa",
  "metadata",
  "privacy",
  "metadata-cleaner",
  "open-source",
  "content-credentials",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pillow>=10.3",
  "pikepdf>=8.15",
  "python-multipart>=0.0.9",
  "markdown>=3.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/bens777/ghostmark"
Repository = "https://github.com/bens777/ghostmark"
Issues = "https://github.com/bens777/ghostmark/issues"

[project.scripts]
ghostmark = "ghostmark.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostmark"]
# Static frontend assets under src/ghostmark/web/static are already
# included by `packages` above (hatchling includes all files in a package
# tree, not just .py). Do NOT also list them under force-include -- that
# adds the same files to the wheel twice at the same path and hatchling
# refuses to build (surfaces only on a real, non-editable `pip install .`,
# e.g. in Docker -- `pip install -e .` doesn't build a wheel the same way).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length is not worth churn here.
# B008: Typer/FastAPI's dependency-injection style relies on calls (typer.Option(...),
# File(...)) as argument defaults -- that is the idiomatic, documented usage for both
# frameworks, not a mutable-default bug.
ignore = ["E501", "B008"]

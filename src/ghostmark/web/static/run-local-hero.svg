<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 130" width="240" height="130" role="img" aria-label="An original GhostMark illustration: a small ship sailing away from a harbor, toward open water">
  <!-- Original artwork for GhostMark. Simple line-art, no third-party or franchise
       imagery. Self-contained theming (works via <img>, which does not inherit
       the host page's CSS custom properties). -->
  <style>
    .gm-line { stroke: #56638a; }
    .gm-brass { stroke: #e8a233; fill: #e8a233; }
    .gm-ghost { fill: #12b8a6; stroke: #12b8a6; }
    .gm-water { stroke: #f0ddba; }

    @media (prefers-color-scheme: dark) {
      .gm-line { stroke: #a9bad9; }
      .gm-brass { stroke: #f2b84d; fill: #f2b84d; }
      .gm-ghost { fill: #4fe0cc; stroke: #4fe0cc; }
      .gm-water { stroke: #2c4a72; }
    }
  </style>

  <!-- harbor, left: a simple dock and two buildings -->
  <g class="gm-line" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="10" y1="104" x2="46" y2="104" />
    <line x1="16" y1="104" x2="16" y2="70" />
    <rect x="10" y="52" width="12" height="18" />
    <line x1="16" y1="52" x2="16" y2="42" />
    <rect x="30" y="60" width="14" height="10" />
  </g>

  <!-- water line, spanning the full width -->
  <path class="gm-water" fill="none" stroke-width="2" stroke-linecap="round"
        d="M4 104 Q40 98 76 104 T148 104 T220 104" />

  <!-- ship, sailing right / away from the harbor -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path class="gm-line" stroke-width="3" d="M150 100 L212 100 L200 112 L162 112 Z" />
    <line class="gm-line" stroke-width="3" x1="181" y1="100" x2="181" y2="58" />
    <path class="gm-brass" stroke-width="2" d="M183 60 L183 92 L204 92 Z" opacity="0.9" />
  </g>

  <!-- a faint spectral wisp trailing behind the ship, toward the harbor:
       whatever the provider's pipeline would have added simply never happens -->
  <g class="gm-ghost" opacity="0.5">
    <circle cx="120" cy="90" r="2.4" />
    <circle cx="104" cy="86" r="2" />
    <circle cx="90" cy="90" r="1.6" />
  </g>
</svg>

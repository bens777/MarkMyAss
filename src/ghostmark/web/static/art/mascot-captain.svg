<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" width="260" height="200" role="img" aria-label="An original GhostMark illustration: a pirate captain on a ship's deck holding a spyglass, with a small spectral ghost floating beside a document">
  <!-- Original artwork for GhostMark. No third-party, franchise, or copyrighted imagery.
       Self-contained theming (light/dark) so this renders correctly whether inlined
       or referenced via <img>, which does not inherit the host page's CSS. -->
  <style>
    .gm-line { stroke: #9aa1ad; }
    .gm-ink { fill: #e7e9ee; }
    .gm-ghost { fill: #b9f5ff; }
    .gm-brass { stroke: #c9a44c; fill: #c9a44c; }
    .gm-deck { stroke: #2a2e38; }
    @media (prefers-color-scheme: light) {
      .gm-line { stroke: #5b6270; }
      .gm-ink { fill: #1c1f26; }
      .gm-ghost { fill: #2f8fa8; }
      .gm-brass { stroke: #946f0f; fill: #946f0f; }
      .gm-deck { stroke: #dfe2ea; }
    }
  </style>

  <!-- deck -->
  <g class="gm-deck" fill="none" stroke-width="2">
    <line x1="10" y1="178" x2="250" y2="178" />
    <line x1="34" y1="178" x2="34" y2="160" />
    <line x1="66" y1="178" x2="66" y2="160" />
    <line x1="196" y1="178" x2="196" y2="160" />
    <line x1="228" y1="178" x2="228" y2="160" />
  </g>

  <!-- ghost companion, floating beside a small document -->
  <g class="gm-ghost" opacity="0.55">
    <path d="M172 150
             V112
             a26 26 0 0 1 52 0
             V150
             l-8.5 -8 -8.5 8 -8.5 -8 -8.5 8 -8.5 -8 Z" />
  </g>
  <g class="gm-line" fill="none" stroke-width="2">
    <circle cx="188" cy="110" r="2.4" fill="currentColor" stroke="none" class="gm-ink" />
    <circle cx="208" cy="110" r="2.4" fill="currentColor" stroke="none" class="gm-ink" />
  </g>

  <!-- small document the ghost is hovering over -->
  <g class="gm-line" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="176" y="150" width="40" height="26" rx="2" />
    <line x1="183" y1="159" x2="209" y2="159" />
    <line x1="183" y1="166" x2="203" y2="166" />
  </g>

  <!-- captain silhouette -->
  <g class="gm-ink">
    <!-- coat -->
    <path d="M78 112 L118 112 L132 178 L58 178 Z" />
    <!-- head -->
    <circle cx="98" cy="92" r="14" />
    <!-- tricorne hat: wide flat brim + domed crown, a simplified but
         unmistakable "captain's hat" silhouette rather than a literal
         three-cornered hat, which reads poorly at small sizes -->
    <ellipse cx="98" cy="79" rx="27" ry="6.5" />
    <path d="M76 79 Q98 52 120 79 Z" />
  </g>

  <!-- raised arm + spyglass, drawn as line art over the silhouette -->
  <g class="gm-line" fill="none" stroke-width="5" stroke-linecap="round">
    <line x1="116" y1="112" x2="150" y2="84" />
  </g>
  <g class="gm-brass" stroke-width="2">
    <rect x="146" y="76" width="26" height="10" rx="3" transform="rotate(-27 159 81)" />
  </g>
</svg>

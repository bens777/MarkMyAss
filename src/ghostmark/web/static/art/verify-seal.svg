<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="A wax-seal stamp, GhostMark's icon for independent verification">
  <!-- Original artwork for GhostMark. -->
  <style>
    .gm-brass { stroke: #e8a233; }
    .gm-ghost { stroke: #12b8a6; }

    @media (prefers-color-scheme: dark) {
      .gm-brass { fill: none; stroke: #f2b84d; }
      .gm-ghost { stroke: #4fe0cc; }
    }
  </style>
  <g class="gm-brass" stroke-width="3">
    <circle cx="48" cy="48" r="34" />
    <circle cx="48" cy="48" r="26" stroke-dasharray="2.5 5" />
  </g>
  <g class="gm-ghost" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 49 L44 59 L64 37" />
  </g>
</svg>
